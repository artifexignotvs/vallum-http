[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vallum-http"
version = "0.2.0"
description = "Small, transparent HTTP response security checks for terminals and CI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vallum contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
vallum-http = "vallum_http.cli:main"

[tool.setuptools.packages.find]
include = ["vallum_http*"]
